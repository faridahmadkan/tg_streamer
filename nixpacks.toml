
providers = ["node"]

[phases.setup]
nixPkgs = [
  "nodejs",
  "python311",
  "ffmpeg",
  "yt-dlp",
  "gcc",
  "pkg-config",
  "git"
]

nixLibs = ["stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "node --version && npm --version",
  "npm install --omit=dev",
  "python3 -m venv .venv",
  ".venv/bin/pip install --upgrade pip setuptools wheel",
  ".venv/bin/pip install -r requirements.txt"
]

[start]
cmd = "node server.js"
